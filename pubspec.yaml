name: simple_kiosk
description: 성당 로비/디지털 사이니지용 Flutter 키오스크 WebView 앱 (Windows / Android 공용).
publish_to: "none"
version: 1.2.4

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # 포토갤러리 대기화면의 게시판 HTML 요청/파싱.
  http: ^1.6.0
  html: ^0.15.6
  crypto: ^3.0.6
  package_info_plus: ^8.3.1
  # Android / iOS / macOS / Windows를 지원하는 InAppWebView.
  # Windows는 WebView2 Runtime 기반으로 동작한다.
  flutter_inappwebview: ^6.1.5
  # 대기화면 동영상 재생.
  # video_player는 Android/iOS/macOS/Web 공식 지원.
  # Windows는 video_player_win이 같은 VideoPlayerController API를 제공한다.
  video_player: ^2.9.2
  video_player_win: ^3.1.1
  # 데스크톱(Windows/macOS/Linux) 키오스크 전체화면 제어.
  window_manager: ^0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config/menu.defaults.json
    - assets/icons/
    - assets/idle/
