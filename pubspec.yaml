name: simple_kiosk
description: 성당 로비용 Flutter 디지털 사이니지 WebView 앱 (Windows / Android 공용).
publish_to: "none"
version: 1.2.40

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # 포토갤러리 대기화면의 게시판 HTML 요청/파싱.
  http: ^1.6.0
  html: ^0.15.6
  markdown: ^7.3.1
  crypto: ^3.0.6
  characters: ^1.4.0
  # PowerShell 없이 동작하는 Windows 업데이트 실행기의 ZIP 해제.
  archive: ^4.1.0
  # 네이티브 업데이트 실행기에서 앱 프로세스 종료를 안전하게 대기.
  win32: ^5.15.0
  ffi: ^2.1.4
  # Windows 사이니지 화면을 저부하 JPEG 미리보기 프레임으로 인코딩.
  image: ^4.5.4
  # 관리자 PIN 창에서 웹 관리자 페이지를 기본 브라우저로 열기.
  url_launcher: ^6.3.2
  package_info_plus: ^8.3.1
  # Android / iOS / macOS / Windows를 지원하는 InAppWebView.
  # Windows는 WebView2 Runtime 기반으로 동작한다.
  flutter_inappwebview: ^6.1.5
  # 대기화면 동영상 재생.
  # video_player는 Android/iOS/macOS/Web 공식 지원.
  # Windows는 video_player_win이 같은 VideoPlayerController API를 제공한다.
  video_player: ^2.9.2
  video_player_win: ^3.1.1
  # 데스크톱(Windows/macOS/Linux) 사이니지 전체화면 제어.
  window_manager: ^0.4.3
  # 데스크톱 시스템 트레이 아이콘과 메뉴.
  tray_manager:
    path: packages/tray_manager-0.5.3
  # 관리 API의 .local 호스트 이름과 HTTP 서비스를 mDNS로 광고.
  mdns_dart: ^2.2.2
  # 외부 ssh.exe 없이 원격 WEB 관리자 reverse forwarding을 연결합니다.
  # OpenSSH stream-local reverse forwarding 지원을 추가한 소스 포함 버전입니다.
  dartssh2:
    path: packages/dartssh2-3.3.1

# Windows 0.6.0의 DevTools 이벤트 등록 시 null 토큰을 넘기는 문제를 수정한 로컬 패치.
dependency_overrides:
  flutter_inappwebview_windows:
    path: packages/flutter_inappwebview_windows-0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/admin/
    - assets/config/menu.defaults.json
    - assets/icons/
    - assets/icons/languages/
    - assets/idle/
    - assets/fonts/README.md
