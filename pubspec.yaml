name: simple_kiosk
description: 성당 로비/디지털 사이니지용 Flutter 키오스크 WebView 앱 (Windows / Android 공용).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # Android / iOS / macOS / Windows를 지원하는 InAppWebView.
  # Windows는 WebView2 Runtime 기반으로 동작한다.
  flutter_inappwebview: ^6.1.5

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config/menu.json
