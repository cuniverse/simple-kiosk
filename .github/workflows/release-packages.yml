name: Build Windows release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release tag (예: v1.0.0)"
        required: true
        default: "v1.0.0"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Build and publish Windows package
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
      WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Resolve package version from release tag
        id: release-version
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(?<Version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?)$') {
            throw "Release tag must use a semantic version such as v1.2.0: $env:RELEASE_TAG"
          }
          "RELEASE_VERSION=$($Matches.Version)" >> $env:GITHUB_ENV
          "version=$($Matches.Version)" >> $env:GITHUB_OUTPUT
          "archive-version=$($Matches.Version.Replace('+', '-'))" >> $env:GITHUB_OUTPUT

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Windows package
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw 'Inno Setup installation failed.'
          }
          $arguments = @{
            PackageVersion = $env:RELEASE_VERSION
            BuildInstaller = $true
          }
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_BASE64)) {
            $certificate = Join-Path $env:RUNNER_TEMP 'simple-kiosk-signing.pfx'
            [IO.File]::WriteAllBytes(
              $certificate,
              [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64)
            )
            $arguments.SigningCertificatePath = $certificate
            $pfx = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
              $certificate,
              $env:WINDOWS_SIGNING_CERT_PASSWORD
            )
            "WINDOWS_SIGNING_CERT_THUMBPRINT=$($pfx.Thumbprint)" >> $env:GITHUB_ENV
          }
          .\scripts\package-windows.ps1 @arguments

      - name: Remove temporary signing certificate
        if: always()
        shell: pwsh
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP 'simple-kiosk-signing.pfx'
          if (Test-Path -LiteralPath $certificate) {
            Remove-Item -LiteralPath $certificate -Force
          }

      - name: Create update manifest
        shell: pwsh
        run: |
          .\scripts\create-update-manifest.ps1 `
            -Version $env:RELEASE_VERSION `
            -PackagePath "dist/simple-kiosk-windows-${{ steps.release-version.outputs.archive-version }}.zip" `
            -RequireAuthenticode:$(-not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_BASE64)) `
            -SignerThumbprint $env:WINDOWS_SIGNING_CERT_THUMBPRINT

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: simple-kiosk-windows
          path: |
            dist/simple-kiosk-windows-${{ steps.release-version.outputs.archive-version }}.zip
            dist/simple-kiosk-windows-setup-${{ steps.release-version.outputs.archive-version }}.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: 여의도성당Signage ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            dist/simple-kiosk-windows-${{ steps.release-version.outputs.archive-version }}.zip
            dist/simple-kiosk-windows-setup-${{ steps.release-version.outputs.archive-version }}.exe
            dist/update-manifest.json
