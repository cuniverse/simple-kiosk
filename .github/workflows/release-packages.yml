name: Build release packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  android:
    name: Android APK package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash scripts/package-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: simple-kiosk-android
          path: dist/*.zip
          if-no-files-found: error

  windows:
    name: Windows portable package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - shell: powershell
        run: .\scripts\package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: simple-kiosk-windows
          path: dist/*.zip
          if-no-files-found: error

  macos:
    name: macOS app package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: simple-kiosk-macos
          path: dist/*.zip
          if-no-files-found: error
